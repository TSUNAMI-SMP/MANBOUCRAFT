# Probabilities are 0.0..1.0 per eligible event/interval, never per tick.
# Any positive final fall damage causes guaranteed death, even during respawn protection.
fatal-fall-damage: true
fatal-fall-message: "たった一段の油断で骨も心も折れた。"
respawn-protection-seconds: 10
# Crouch to prevent fear/stress deaths; physical damage and unsafe food are not prevented.
calm-protection-while-sneaking: true
message-color: auto
suppress-overworld-hostiles: true
# Optional: exact Bukkit plugin name of your grave provider.
# If set and the provider is disabled/missing, all special deaths pause.
# Empty means external grave handling is assumed (not verified).
required-grave-plugin: ""
# Each of the 55 probabilistic rules can be configured here.
config-version: 2
